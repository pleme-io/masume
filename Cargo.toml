[workspace]
resolver = "2"
members = ["masume-types", "masume"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/masume"
authors = ["pleme-io"]

[workspace.dependencies]
masume-types = { path = "masume-types" }
masume = { path = "masume" }

[workspace.lints]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
